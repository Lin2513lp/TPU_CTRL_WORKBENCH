<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1870" viewBox="0 0 1800 1870" role="img" aria-labelledby="title desc">
<title id="title">CPU、AHB_SLAVE、REG_MAP、TPU_CTRL、FIFO 与 SA 整体连接</title>
<desc id="desc">CPU 经 AHB_SLAVE 读写 REG_MAP。REG_MAP 向 CTRL 发送配置，CTRL 回传状态；FIFO_IN 向 CTRL 提供输入，CTRL 逐行对齐后送给 SA。权重及静态配置另接 SA，SA 的32位rpt_active_size经待实现的状态跨域返回REG_MAP。CRG控制接时钟复位模块，SA结果接FIFO_OUT。</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#3570b5"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#22856a"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#ad7a27"/></marker></defs>
<style>text{font-family:Consolas,'Microsoft YaHei',sans-serif;fill:#233b55;font-size:23px}.title{font-size:32px;font-weight:600}.heading{font-size:28px;font-weight:600}.note{font-size:21px;fill:#61748b}.small{font-size:20px;fill:#61748b}.blue,.green,.amber{fill:none;stroke-width:2.6;stroke-linejoin:round}.blue{stroke:#3570b5;marker-end:url(#blue)}.green{stroke:#22856a;marker-end:url(#green)}.amber{stroke:#ad7a27;stroke-dasharray:8 6;marker-end:url(#amber)}</style>
<rect width="1800" height="1870" fill="#f7f9fc"/>

